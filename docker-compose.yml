services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hospital_mis}
      POSTGRES_USER: ${POSTGRES_USER:-hospital_mis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hospital_mis}
    ports:
      # Host-side port is remappable (default 5433) since a local machine may
      # already run Postgres natively on 5432; containers always talk to
      # each other via the internal "postgres:5432" service address below.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hospital_mis}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend: &backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      # Host-side port is remappable (default 8010) — 8000 is commonly taken
      # by other local projects; the container always listens on 8000
      # internally regardless of the host-side mapping.
      - "${BACKEND_HOST_PORT:-8010}:8000"
    env_file:
      - ./backend/.env
    environment:
      # Overrides whatever's in .env: inside the compose network every
      # container reaches Postgres/Redis via their service names on the
      # internal port, never the host-remapped one above.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    <<: *backend
    command: celery -A config worker -l info
    ports: []

  celery-beat:
    <<: *backend
    command: celery -A config beat -l info
    ports: []

volumes:
  postgres_data:

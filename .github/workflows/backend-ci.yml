name: Backend CI

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: backend

env:
  DJANGO_SETTINGS_MODULE: config.settings.dev
  DJANGO_SECRET_KEY: ci-only-secret-key-not-for-real-use
  DJANGO_DEBUG: "true"
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
  POSTGRES_DB: hospital_mis_ci
  POSTGRES_USER: hospital_mis
  POSTGRES_PASSWORD: hospital_mis
  POSTGRES_HOST: localhost
  POSTGRES_PORT: "5432"
  REDIS_URL: redis://localhost:6379/0
  # CI-only key, not used anywhere real — generated with Fernet.generate_key().
  MFA_SECRET_ENCRYPTION_KEY: P-7KyDlD93Woc-xWExgBo1alJQ4gCHgI2hk2Oy-ZX_w=

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - run: black --check apps/ config/
      - run: isort --check apps/ config/
      - run: flake8 apps/ config/

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hospital_mis_ci
          POSTGRES_USER: hospital_mis
          POSTGRES_PASSWORD: hospital_mis
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hospital_mis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Smoke tests (fail fast)
        run: python -m pytest -m smoke -v
      - name: Full regression suite with coverage gate
        run: python -m pytest -v

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - name: Dependency vulnerability scan (pip-audit)
        run: pip-audit -r requirements/base.txt
      - name: SAST (bandit)
        run: bandit -r apps/ -x "*/tests/*,*/migrations/*"
      - name: Secrets scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t hospital-mis-backend:ci ./backend
      - name: Verify no secrets/venv baked into the image
        run: |
          if docker run --rm hospital-mis-backend:ci sh -c 'test -e .env -o -d .venv'; then
            echo "::error::.env or .venv present in the built image"
            exit 1
          fi

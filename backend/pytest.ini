[pytest]
DJANGO_SETTINGS_MODULE = config.settings.dev
python_files = test_*.py
addopts = --reuse-db --cov=apps --cov-report=term-missing --cov-fail-under=80
markers =
    smoke: fast critical-path checks that must never break (CLAUDE.md §6.3)
    security: permission-boundary and other security-focused tests (CLAUDE.md §6.4)
